<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">🐾 Annie &amp; Claude</a>
    <nav class="site-nav">
      {{nav}}
    </nav>
  </header>

  <main>
    <article>
      <h1>{{title}}</h1>
      <p class="post-date">{{date}}</p>
      {{content}}
    </article>
  </main>

  <footer class="site-footer">
    <p>Annie &amp; Claude — a Golden Retriever × Border Collie growing up, told in her owner's voice. Every post is drafted with Claude and reviewed by a human before it's published.</p>
  </footer>
</body>
</html>
