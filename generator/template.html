<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/journey.js" defer></script>
</head>
<body class="{{bodyClass}}">
  <div class="backdrop" aria-hidden="true">
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>
    <div class="hills hills-back"></div>
    <div class="hills hills-front"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="/">
      <svg class="badge" viewBox="0 0 100 110" width="34" height="37" role="img" aria-label="Annie and Claude">
        <circle class="badge-ring" cx="50" cy="62" r="42" fill="none" stroke-width="4"/>
        <text class="badge-text" x="50" y="72" text-anchor="middle">A&amp;C</text>
        <g transform="translate(68,15) rotate(18)">
          <g class="bow">
            <path d="M0 8 C -15 -6 -22 11 -3 14 C -9 5 -4 3 0 8 Z"/>
            <path d="M0 8 C 15 -6 22 11 3 14 C 9 5 4 3 0 8 Z"/>
            <circle class="bow-knot" cx="0" cy="9" r="4.5"/>
            <path d="M-3 12 L-8 24 L-2 20 Z"/>
            <path d="M3 12 L8 24 L2 20 Z"/>
          </g>
        </g>
      </svg>
      <span class="brand-word">Annie &amp; Claude</span>
    </a>
    <nav class="site-nav">
      {{nav}}
    </nav>
  </header>

  <main>
    <article>
      <h1>{{title}}</h1>
      <p class="post-date">{{date}}</p>
      {{content}}
    </article>
  </main>

  <footer class="site-footer">
    <p>Annie &amp; Claude. A Golden Retriever × Border Collie growing up, told in her owner's voice.</p>
  </footer>

  <!-- A stylised little friend, not a portrait. journey.js reveals it. -->
  <div class="pup" hidden aria-hidden="true">
    <svg viewBox="0 0 120 100" width="100%">
      <g class="legs-a">
        <rect x="34" y="72" width="7" height="20" rx="3.5" fill="#f0dfc0"/>
        <rect x="50" y="72" width="7" height="20" rx="3.5" fill="#e8d3ac"/>
        <rect x="66" y="72" width="7" height="20" rx="3.5" fill="#e8d3ac"/>
        <rect x="80" y="72" width="7" height="20" rx="3.5" fill="#f0dfc0"/>
      </g>
      <g class="legs-b">
        <rect x="38" y="72" width="7" height="20" rx="3.5" fill="#e8d3ac"/>
        <rect x="46" y="72" width="7" height="20" rx="3.5" fill="#f0dfc0"/>
        <rect x="70" y="72" width="7" height="20" rx="3.5" fill="#f0dfc0"/>
        <rect x="76" y="72" width="7" height="20" rx="3.5" fill="#e8d3ac"/>
      </g>
      <path d="M26 60 Q10 50 13 36 Q22 44 30 52 Z" fill="#e2b97e"/>
      <ellipse cx="54" cy="62" rx="30" ry="20" fill="#f0dfc0"/>
      <ellipse cx="46" cy="55" rx="16" ry="10" fill="#e2b97e" opacity="0.75"/>
      <circle cx="88" cy="42" r="17" fill="#f0dfc0"/>
      <ellipse cx="96" cy="48" rx="8" ry="6" fill="#f7ecd6"/>
      <circle cx="101" cy="46" r="2.6" fill="#4a3a30"/>
      <circle cx="88" cy="39" r="2.2" fill="#4a3a30"/>
      <path d="M78 28 Q70 42 79 50 Q83 38 88 29 Z" fill="#d9b98a"/>
      <path d="M72 52 Q81 59 91 57 L90 62 Q80 64 70 57 Z" fill="#4c7a50"/>
      <g transform="translate(73,59) rotate(-12) scale(0.55)">
        <path d="M0 8 C -15 -6 -22 11 -3 14 C -9 5 -4 3 0 8 Z" fill="#d98fa0"/>
        <path d="M0 8 C 15 -6 22 11 3 14 C 9 5 4 3 0 8 Z" fill="#d98fa0"/>
        <circle cx="0" cy="9" r="4.5" fill="#c17a8e"/>
      </g>
    </svg>
  </div>
</body>
</html>
