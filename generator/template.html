<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Annie</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #2b241d;
      --paper: #faf6ef;
      --accent: #b5651d;
      --muted: #6b6258;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      line-height: 1.6;
    }
    header {
      padding: 2rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(43, 36, 29, 0.15);
    }
    header a {
      color: var(--ink);
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    time {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    a { color: var(--accent); }
    img { max-width: 100%; height: auto; border-radius: 4px; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">Annie</a>
  </header>
  <main>
    <h1>{{title}}</h1>
    {{dateBlock}}
    {{content}}
  </main>
  <footer>
    A dog's life, in her owner's words.
  </footer>
</body>
</html>
